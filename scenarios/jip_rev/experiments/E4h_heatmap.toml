# E4h:本実験。μθ × P のヒートマップ(2 経路)を V2V only / Vehicular DTN の両方で作り、差(DTN − V2V only)も出す
#   構成   : 2 経路 (1-1-2)
#   条件   : 論文 Fig.8/9 と同じ 5×5 = 25 条件。μθ = 150/200/250/300/350 s(σθ = 100 s)× P = 0.10/0.15/0.20/0.25/0.30
#            (config_scenario_1〜25。値は下の expect で確認)
#   版     : v2v_only / v2v_dtn(同じコード・同じシード。違いは通信方式だけ)
#   修正   : fix_origin_edge + fix_alternative_from_table、offset 0、最高速度・自由流速度 9 m/s、
#            経路別平均は時間窓(W は E2w の結果で 1 つに決める。既定 300 s、最低 3 台)、終了 4,000 s
#   回数   : 25 条件 × 2 版 × シード 1–50 = 2,500 回(1 回 10–15 分。56 並列で 9〜11 時間)
#   出力   : これまでの集計 + ヒートマップ(完了時刻・平均到着・経路変更、方式ごと + 差)
name = "E4h-heatmap"
description = "本実験: μθ × P ヒートマップ(2 経路)、V2V only / DTN、9 m/s、時間窓"
seed_start = 1
seed_end = 50
early_rate = 1.0
v2v_rate = 1.0
layouts = ["1-1-2"]
aggregator = "aggregate_e2.py"

[conditions.mu150_p010]
config = "scenarios/JIP/configs/config_scenario_1.toml"
expect = { active_route_change_threshold_center = 150.0, active_route_change_threshold_spread = 100.0, p_follow = 0.1 }


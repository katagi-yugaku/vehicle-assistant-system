# 比べる組:各 W で V2V only → DTN、DTN で累積 → 各 W
[compare]
pairs = [["only_cum", "dtn_cum"], ["only_w200", "dtn_w200"], ["only_w300", "dtn_w300"], ["only_w600", "dtn_w600"], ["dtn_cum", "dtn_w200"], ["dtn_cum", "dtn_w300"], ["dtn_cum", "dtn_w600"]]
labels = { only_cum = "V2V only (cumulative)", dtn_cum = "DTN (cumulative)", only_w200 = "V2V only (W=200 s)", dtn_w200 = "DTN (W=200 s)", only_w300 = "V2V only (W=300 s)", dtn_w300 = "DTN (W=300 s)", only_w600 = "V2V only (W=600 s)", dtn_w600 = "DTN (W=600 s)" }

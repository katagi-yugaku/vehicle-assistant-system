# E2w:経路別平均の時間窓の感度(9 m/s 版)。V2V only / DTN の差と、累積平均との違いを見る
#   構成   : 2 経路 (1-1-2)
#   条件   : μθ = 60 s・σθ = 50 s / μθ = 150 s・σθ = 100 s(論文の条件)
#   平均   : cum = 累積平均(元の方式)/ w200・w300・w600 = 直近 W 秒の到着(窓内が 3 台未満なら直近 3 台まで広げる)
#   版     : {only,dtn}_{cum,w200,w300,w600} = 2 方式 × 4 = 8 版。違いは通信方式と平均の取り方だけ
#   修正   : fix_origin_edge + fix_alternative_from_table、offset 0、最高速度・自由流速度 9 m/s、終了 4,000 s
#   回数   : 2 条件 × 8 版 × シード 1–10 = 160 回(1 回 10–15 分。72 並列なら 40 分前後)
name = "E2w-window"
description = "時間窓の感度: cum / W=200,300,600 s × V2V only / DTN、9 m/s 版"
seed_start = 1
seed_end = 10
early_rate = 1.0
v2v_rate = 1.0
layouts = ["1-1-2"]
aggregator = "aggregate_e2.py"

[conditions.mu060_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu060_sd050.toml"
expect = { active_route_change_threshold_center = 60.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu150_sd100]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu150_sd100.toml"
expect = { active_route_change_threshold_center = 150.0, active_route_change_threshold_spread = 100.0, p_follow = 0.1 }

[variants.only_cum]
communication_mode = "v2v_only"
fix_origin_edge = true
fix_alternative_from_table = true
travel_time_offset = 0.0
vehicle_max_speed = 9.0
free_flow_speed = 9.0
end_simulation_time = 4000
save_raw = true
log_information = true
log_decisions = true

[variants.dtn_cum]
communication_mode = "v2v_dtn"
fix_origin_edge = true
fix_alternative_from_table = true
travel_time_offset = 0.0
vehicle_max_speed = 9.0
free_flow_speed = 9.0
end_simulation_time = 4000
save_raw = true
log_information = true
log_decisions = true

[variants.only_w200]
communication_mode = "v2v_only"
fix_origin_edge = true
fix_alternative_from_table = true
travel_time_offset = 0.0
vehicle_max_speed = 9.0
free_flow_speed = 9.0
end_simulation_time = 4000
save_raw = true
log_information = true
log_decisions = true
avg_window_s = 200.0
avg_window_min_samples = 3


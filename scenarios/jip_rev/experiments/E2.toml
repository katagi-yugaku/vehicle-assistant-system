# E2:通信方式の比較(M3、Fig.12 の差し替え)— μθ の掃引(2026-11-06 版)
#   方針:E2 シミュレーション方針(Claude Docs)https://claude.ai/artifact/Fxoe6sTTSLAtpJE4ZUvW9X
#   構成   : 2 経路 (1-1-2)
#   条件   : μθ = 60, 90, ..., 300 s(σθ = 50 s)+ 主結果との橋渡し μθ = 150 s・σθ = 100 s。P = 0.10
#   版     : v2v_only / v2v_dtn(同じコード・同じシード。違いは通信方式だけ)
#   修正   : fix_origin_edge(E0 の擬似 U ターン)+ fix_alternative_from_table(原稿の式 (1))、
#            travel_time_offset = 0。伝達の記録 log_information あり
#   回数   : シード 1–50 → 10 × 2 × 50 = 1,000 回(1 回 約 12 分、32 並列で約 6.5 時間)
#   通信なしは θ によらず同じ結果なので、別の実験定義 E2_none.toml(1 条件)で回す
name = "E2"
description = "通信方式の比較 (V2V only / DTN)、μθ 60–300 s の掃引、修正版"
seed_start = 1
seed_end = 50
early_rate = 1.0
v2v_rate = 1.0
layouts = ["1-1-2"]
aggregator = "aggregate_e2.py"

[conditions.mu060_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu060_sd050.toml"
expect = { active_route_change_threshold_center = 60.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu090_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu090_sd050.toml"
expect = { active_route_change_threshold_center = 90.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu120_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu120_sd050.toml"
expect = { active_route_change_threshold_center = 120.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu150_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu150_sd050.toml"
expect = { active_route_change_threshold_center = 150.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu180_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu180_sd050.toml"
expect = { active_route_change_threshold_center = 180.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu210_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu210_sd050.toml"
expect = { active_route_change_threshold_center = 210.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu240_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu240_sd050.toml"
expect = { active_route_change_threshold_center = 240.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu270_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu270_sd050.toml"
expect = { active_route_change_threshold_center = 270.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu300_sd050]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu300_sd050.toml"
expect = { active_route_change_threshold_center = 300.0, active_route_change_threshold_spread = 50.0, p_follow = 0.1 }

[conditions.mu150_sd100]
config = "scenarios/JIP/configs/rev_e2/config_e2_mu150_sd100.toml"
expect = { active_route_change_threshold_center = 150.0, active_route_change_threshold_spread = 100.0, p_follow = 0.1 }

# 版ごとの設定(code/evacsim/sim/revision_options.py)
[variants.v2v_only]
communication_mode = "v2v_only"
fix_origin_edge = true
fix_alternative_from_table = true
travel_time_offset = 0.0
end_simulation_time = 3500
save_raw = true
log_information = true

[variants.v2v_dtn]
communication_mode = "v2v_dtn"
fix_origin_edge = true
fix_alternative_from_table = true
travel_time_offset = 0.0
end_simulation_time = 3500
save_raw = true
log_information = true

# 比べる組(aggregate_e2.py)。差は「後 − 前」(負なら DTN の方が短い)
[compare]
pairs = [["v2v_only", "v2v_dtn"]]
labels = { v2v_dtn = "Vehicular DTN", v2v_only = "V2V only" }
